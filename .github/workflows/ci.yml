name: Windows build and checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build, check and package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ./tools/build-release.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: Check installer upgrades and uninstall
        run: ./tests/installer/Test-Upgrade.ps1
      - name: Upload release packages
        uses: actions/upload-artifact@v6
        with:
          name: LazySkald-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
